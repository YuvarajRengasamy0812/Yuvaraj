[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Visit log API -> Netlify function (must come before the SPA fallback)
[[redirects]]
  from = "/api/visits"
  to = "/.netlify/functions/visits"
  status = 200
  force = true

# Client-side routes (/about, /travel/..., /visitors) all load the React app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
