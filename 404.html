<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found · Yuvaraj R</title>
  <link rel="shortcut icon" href="/assets/images/man.png" type="image/x-png" />
  <style>
    :root {
      --accent: #ff1d48;
      --ink: #1d2235;
      --muted: #6b7280;
      --chip: #f3f4f8;
      --bg: #fff5f7;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      background: radial-gradient(circle at 20% 0%, #ffd6df 0, transparent 45%), var(--bg);
      color: var(--ink);
      font-family: "Inria Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    main {
      display: grid;
      place-items: center;
      padding: 48px 20px;
      text-align: center;
    }

    .code {
      font-size: clamp(96px, 22vw, 180px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      color: transparent;
      -webkit-text-stroke: 2px var(--accent);
    }

    h1 { margin-top: 12px; font-size: clamp(22px, 4vw, 30px); }
    p { margin-top: 10px; color: var(--muted); font-size: 16px; }

    .home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 28px;
      padding: 12px 22px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .home:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -10px rgba(255, 29, 72, 0.6); }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 20px 24px;
      border-top: 1px solid rgba(29, 34, 53, 0.08);
      color: var(--muted);
      font-size: 14px;
    }

    .socials { display: flex; gap: 8px; }

    .socials a {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--chip);
      color: var(--ink);
      transition: color 0.2s ease, background-color 0.2s ease;
    }

    .socials a:hover { background: var(--accent); color: #fff; }
  </style>
</head>
<body>
  <main>
    <div>
      <div class="code" aria-hidden="true">404</div>
      <h1>This page took a wrong turn.</h1>
      <p>The link might be old, or the page has moved. Let's get you back.</p>
      <a class="home" href="/">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5.5M10.5 6.5 5 12l5.5 5.5" /></svg>
        Back to home
      </a>
    </div>
  </main>

      </a>
